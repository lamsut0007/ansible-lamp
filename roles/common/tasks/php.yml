---
  - name: Install PHP 8.1 and common extensions
    yum:
      name:
        - php
        - php-bcmath
        - php-bz2
        - php-calendar
        - php-cli
        - php-common
        - php-ctype
        - php-curl
        - php-date
        - php-dom
        - php-exif
        - php-fileinfo
        - php-filter
        - php-ftp
        - php-gd
        - php-gettext
        - php-hash
        - php-iconv
        - php-intl
        - php-json
        - php-libxml
        - php-mbstring
        - php-mysqli
        - php-mysqlnd
        - php-openssl
        - php-pcntl
        - php-pcre
        - php-pdo
        - php-pdo_mysql
        - php-pdo_sqlite
        - php-phar
        - php-posix
        - php-readline
        - php-reflection
        - php-session
        - php-shmop
        - php-simplexml
        - php-sockets
        - php-spl
        - php-sqlite3
        - php-standard
        - php-sysvmsg
        - php-sysvsem
        - php-sysvshm
        - php-tokenizer
        - php-xml
        - php-xmlreader
        - php-xmlwriter
        - php-xsl
        - php-zip
        - php-zlib
      state: present

  - name: Install build dependencies for imagick
    yum:
      name:
        - php-pear
        - php-devel
        - gcc
        - ImageMagick
        - ImageMagick-devel
      state: present

  - name: Install imagick via pecl
    shell: |
      yes '' | pecl install -f imagick
    args:
      creates: /usr/lib64/php/modules/imagick.so

  - name: Enable imagick extension
    copy:
      dest: /etc/php.d/20-imagick.ini
      content: "extension=imagick.so\n"
      owner: root
      group: root
      mode: '0644'

  - name: Restart php-fpm service
    systemd:
      name: php-fpm
      state: restarted
