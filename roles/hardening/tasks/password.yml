---
- name: Configure password aging parameters in /etc/login.defs
  lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}"
    line: "{{ item.key }}   {{ item.value }}"
    state: present
    backup: yes
  loop:
    - { key: "PASS_MAX_DAYS", value: "90" }
    - { key: "PASS_MIN_DAYS", value: "1" }
    - { key: "PASS_MIN_LEN", value: "8" }
    - { key: "PASS_WARN_AGE", value: "28" }

- name: Configure PAM password-auth
  template:
    src: password-auth.j2
    dest: /etc/pam.d/password-auth
    owner: root
    group: root
    mode: '0644'
    backup: yes

- name: Configure PAM system-auth
  template:
    src: system-auth.j2
    dest: /etc/pam.d/system-auth
    owner: root
    group: root
    mode: '0644'
    backup: yes

- name: Enforce password reuse limitation
  lineinfile:
    path: /etc/security/system-auth
    regexp: '^password.*pam_unix.so'
    line: 'password required pam_unix.so md5 remember=5 use_authtok'
    create: yes

- name: Set /etc/security/opasswd ownership and permissions
  file:
    path: /etc/security/opasswd
    owner: root
    group: root
    mode: '0600'
    state: touch

- name: Set permissions on /etc/shadow
  file:
    path: /etc/shadow
    mode: '0400'

- name: Configure password policy in /etc/security/pwquality.conf
  ansible.builtin.blockinfile:
    path: /etc/security/pwquality.conf
    create: yes
    block: |
      minlen = 14
      lcredit = 1
      ucredit = 1
      ocredit = 1
      dcredit = 1
    marker: "# {mark} ANSIBLE MANAGED PASSWORD POLICY"
    backup: yes
