---
- name: Load Zabbix defaults
  ansible.builtin.include_vars:
    file: "{{ role_path }}/defaults/zabbix.yml"

- name: Load environment variables if .env exists
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/env.yml"
    name: env_vars
  ignore_errors: yes

- name: Ensure Docker is installed
  package:
    name: docker
    state: present

- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: true

- name: Pull Zabbix agent Docker image
  community.docker.docker_image:
    name: "{{ env_vars.ZABBIX_IMAGE | default(zabbix_image) }}"
    source: pull

- name: Run Zabbix agent container
  community.docker.docker_container:
    name: zabbix-agent
    image: "{{ env_vars.ZABBIX_IMAGE | default(zabbix_image) }}"
    state: started
    restart_policy: always
    env:
      ZBX_HOSTNAME: "{{ env_vars.ZABBIX_HOSTNAME | default(zabbix_hostname) }}"
      ZBX_SERVER_HOST: "{{ env_vars.ZABBIX_SERVER_HOST | default(zabbix_server_host) }}"
    published_ports:
      - "{{ env_vars.ZABBIX_PORT | default(zabbix_port) }}:{{ env_vars.ZABBIX_PORT | default(zabbix_port) }}"
    init: true
