---
- name: Load Apache defaults
  ansible.builtin.include_vars:
    file: "{{ role_path }}/defaults/apache.yml"

- name: Update DNF metadata
  ansible.builtin.dnf:
    update_cache: yes
  changed_when: false

- name: Install Apache and modules
  ansible.builtin.dnf:
    name: "{{ apache_packages }}"
    state: present

- name: Enable and start Apache service
  ansible.builtin.systemd:
    name: httpd
    enabled: true
    state: started

- name: Check Apache version
  ansible.builtin.command: httpd -v
  register: apache_version
  changed_when: false

- name: Display Apache version info
  ansible.builtin.debug:
    msg: "{{ apache_version.stdout }}"

