---
- name: Load PHP defaults
  ansible.builtin.include_vars:
    file: "{{ role_path }}/defaults/php.yml"

- name: Install PHP and extensions
  ansible.builtin.dnf:
    name: "{{ php_packages }}"
    state: present

- name: Check PHP version
  ansible.builtin.command: php -v
  register: php_version

- name: Show PHP version
  ansible.builtin.debug:
    msg: "{{ php_version.stdout }}"

- name: Install dependencies for Imagick
  ansible.builtin.dnf:
    name: "{{ php_imagick_dependencies }}"
    state: present

- name: Install Imagick {{ php_imagick_version }} via PECL
  ansible.builtin.shell: |
    yes '' | pecl install -f imagick-{{ php_imagick_version }} || true
  register: pecl_imagick
  changed_when: "'already installed' not in pecl_imagick.stdout"

- name: Find imagick.so file
  ansible.builtin.find:
    paths: /usr/lib64/php{{ php_version_full }}/modules
    patterns: imagick.so
  register: imagick_module

- name: Enable Imagick extension
  ansible.builtin.copy:
    dest: /etc/php.d/20-imagick.ini
    content: "extension={{ imagick_module.files[0].path }}\n"
    owner: root
    group: root
    mode: '0644'
  when: imagick_module.matched > 0

- name: Restart php-fpm service
  ansible.builtin.systemd:
    name: php-fpm
    state: restarted
